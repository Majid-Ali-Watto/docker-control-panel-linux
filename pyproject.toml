# Lint settings only; the app is run from the repository root (see README).
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]   # pyflakes: undefined names, redefinitions, syntax problems
# Unused imports and bare f-strings predate CI (some imports are patched by name in the tests);
# every other pyflakes error must stay at zero.
ignore = ["F401", "F541"]
