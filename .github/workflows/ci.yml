name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System Python so that tkinter matches the system Tcl/Tk; xvfb gives Tk a display
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb

      - name: Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install ttkbootstrap ruff

      - name: Lint
        run: |
          "$RUNNER_TEMP/venv/bin/ruff" check .
          "$RUNNER_TEMP/venv/bin/python" -m compileall -q src docker_gui_modular.py

      - name: Unit tests
        run: |
          xvfb-run -a "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -t . -v
          xvfb-run -a "$RUNNER_TEMP/venv/bin/python" test_imports.py
