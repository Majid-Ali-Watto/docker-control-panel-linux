name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # macOS / Windows were added after the app was Linux-only and have not been seen green yet;
    # they report but do not block until they have been (remove this line then).
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # System Python so that tkinter matches the system Tcl/Tk; xvfb gives Tk a display
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb

      # Homebrew's python-tk@3.12 gives macOS a Tk 8.6 (the system one is 8.5)
      - name: Python with Tk (macOS)
        if: runner.os == 'macOS'
        run: brew install python@3.12 python-tk@3.12

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"

      - name: Python environment
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then PY="$(brew --prefix)/bin/python3.12"; else PY=python3; fi
          [ "$RUNNER_OS" = "Windows" ] && PY=python
          "$PY" -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then VPY="$RUNNER_TEMP/venv/Scripts/python.exe"; else VPY="$RUNNER_TEMP/venv/bin/python"; fi
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          "$VPY" -m pip install -r requirements.txt ruff

      - name: Lint
        run: |
          "$VPY" -m ruff check .
          "$VPY" -m compileall -q src docker_gui_modular.py

      - name: Unit tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN "$VPY" -m unittest discover -s tests -t . -v
          $RUN "$VPY" test_imports.py

  installers:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh
        if: runner.os != 'Windows'
        run: ./install.sh

      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1

      - name: Installed app starts its imports
        if: runner.os != 'Windows'
        run: .venv/bin/python -c "import tkinter, ttkbootstrap, PIL; import src.utils.utils"

      - name: Installed app starts its imports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .venv\Scripts\python.exe -c "import tkinter, ttkbootstrap, PIL; import src.utils.utils"
