name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Unit tests on every Python the installer accepts (3.8 = Ubuntu 20.04, 3.12 = Ubuntu 24.04 ...)
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # xvfb gives Tk a display
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Lint
        run: |
          python -m ruff check .
          python -m compileall -q src docker_gui_modular.py

      - name: Unit tests
        run: |
          xvfb-run -a python -m unittest discover -s tests -t . -v
          xvfb-run -a python test_imports.py

  # The real installer, as a normal user with sudo, on the runner's own distro
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - run: ./install.sh
      - run: .venv/bin/python -c "import tkinter, ttkbootstrap, PIL; import src.utils.utils"
      - name: Second run changes nothing
        run: ./install.sh

  # The installer as root on many distributions, in containers (tests/distro_smoke.sh)
  distros:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:latest
          - rockylinux:8
          - rockylinux:9
          - almalinux:9
          - amazonlinux:2023
          - archlinux:latest
          - opensuse/leap:15.6
          - opensuse/tumbleweed:latest
          - alpine:latest
          - ghcr.io/void-linux/void-glibc:latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/distro_smoke.sh ${{ matrix.image }}
